name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          VITE_INTERVIEW_API_URL: ${{ vars.VITE_INTERVIEW_API_URL }}
          VITE_DEEPSEEK_API_KEY: ''
        run: npm run build -- --base=/AI-/

      - name: Verify deployment asset paths
        run: npm run test:deployment -- test/deployment-assets.test.js

      - name: Verify DeepSeek interview and secret isolation
        run: |
          node --test test/interview-worker.test.js test/deepseek-interview.test.js
          node --test --test-name-pattern='parseSseLine|streamInterview' test/interview-client.test.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
